# Documentation sample only (RFC 5737 addresses). Copy and adapt.
# Prefer ${ENV}, password_command, or --ask-pass over plaintext secrets.
platform: auto                 # ios | nxos | dmswitch | dm1200 | comware | auto
transport: ssh                 # telnet | ssh
username: admin
password: "changeme"
enable_password: "changeme"
default_vlan: "1"
no_data_vlan: "999"
multi_mac_policy: ignore       # ignore | alert | priority
backup_dir: ./backups
audit_log: ./audit/negev.jsonl
allowed_vlans:
  - "10"
  - "20"
  - "30"
  - "100"
  - "200"
  - "300"
protected_vlans:
  - "999"
mac_to_vlan:
  "aabbcc": "10"               # even-length hex prefix (2..12)
  "112233": "20"
  "deadbe": "100"
exclude_macs:
  - "ffff.ffff.ffff"
  - "0000.0000.0000"

switches:
  - name: access-a1
    target: 192.0.2.10
    platform: ios
    transport: ssh
    tags: [access, building-a]
    username: switchadmin
    password: "changeme"
    enable_password: "changeme"
    mac_to_vlan:
      "001122": "30"
      "112233": "0"             # drop inherited prefix on this switch
    exclude_macs:
      - "aaaa.bbbb.cccc"

  - name: access-a2
    target: 192.0.2.20
    platform: auto
    tags: [access, building-a]
    default_vlan: "100"
    multi_mac_policy: alert
    exclude_ports:
      - "Gi1/0/24"
      - "Gi1/0/23"
